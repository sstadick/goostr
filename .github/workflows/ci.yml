name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out Goose
        uses: actions/checkout@v4
        with:
          repository: aardappel/goose
          # Compiler revision used for package c_headers and SIMD tests.
          ref: b46099024b9af8a9f54cd76e24953a89c21ccb3a
          path: .ci/goose
          persist-credentials: false
      - name: Check out goosdoc
        uses: actions/checkout@v4
        with:
          repository: sstadick/goosdoc
          ref: fb1c32532a913d1309eda9aa6709e3495ae6e133 # v0.2.0
          path: .ci/goosdoc
          persist-credentials: false
      - name: Build Goose
        run: |
          cmake -S .ci/goose -B .ci/goose/build -DCMAKE_BUILD_TYPE=Debug -DGOOSE_BUILTIN_LIBS=
          cmake --build .ci/goose/build --parallel 2
          echo "$GITHUB_WORKSPACE/.ci/goose/build" >> "$GITHUB_PATH"
          echo "GOOSE_HOME=$RUNNER_TEMP/goostr-home" >> "$GITHUB_ENV"
      - name: Check API reference
        env:
          GOOSDOC: .ci/goosdoc/main.goose
        run: scripts/docs.sh --check
      - name: Run documentation examples
        env:
          GOOSDOC: .ci/goosdoc/main.goose
        run: |
          scripts/doctest.sh
          scripts/doctest.sh --cc gcc
          scripts/doctest.sh --cc clang
      - name: Generate release reference
        env:
          GOOSDOC: .ci/goosdoc/main.goose
          DOC_OUTPUT: ${{ runner.temp }}/API.md
        run: scripts/docs.sh --source-url "https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: ${{ runner.temp }}/API.md
          if-no-files-found: error
      - name: TinyCC tests
        run: |
          for level in 0 2; do
            goose run tests/test.goose --debug "-O$level"
            goose run tests/search.goose --debug "-O$level"
          done
      - name: GCC and Clang tests
        run: |
          for cc in gcc clang; do
            for suite in test search; do
              goose build "tests/$suite.goose" --cc "$cc" --debug -O2 -o "$RUNNER_TEMP/$suite-$cc"
              "$RUNNER_TEMP/$suite-$cc"
            done
          done
      - name: Baseline, scalar, and AVX2 search tests
        run: |
          goose --standalone -o "$RUNNER_TEMP/search.c" tests/search.goose
          for cc in gcc clang; do
            "$cc" -O2 -DGS_SIMD=0 "$RUNNER_TEMP/search.c" -o "$RUNNER_TEMP/search-baseline" -lm -pthread -ldl
            "$RUNNER_TEMP/search-baseline"
            "$cc" -O2 -DGS_SIMD=0 -DGOOSIMD_SCALAR "$RUNNER_TEMP/search.c" -o "$RUNNER_TEMP/search-scalar" -lm -pthread -ldl
            "$RUNNER_TEMP/search-scalar"
            if grep -qw avx2 /proc/cpuinfo; then
              "$cc" -O2 -DGS_SIMD=0 -mavx2 "$RUNNER_TEMP/search.c" -o "$RUNNER_TEMP/search-avx2" -lm -pthread -ldl
              "$RUNNER_TEMP/search-avx2"
            else
              echo "AVX2 tests skipped: runner CPU does not support AVX2"
            fi
          done
          clang -O2 -DGS_SIMD=1 "$RUNNER_TEMP/search.c" -o "$RUNNER_TEMP/search-dispatch" -lm -pthread -ldl
          "$RUNNER_TEMP/search-dispatch"
      - name: Compare with bstr
        run: python3 tests/differential.py

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-reference
          path: docs
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected vMAJOR.MINOR.PATCH"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" docs/API.md --clobber
          else
            gh release create "$TAG" docs/API.md --verify-tag --generate-notes
          fi
